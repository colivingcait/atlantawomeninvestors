name: Sync meetups from Eventbrite

on:
  schedule:
    - cron: "0 12 * * *"   # daily ~7–8am ET (12:00 UTC)
  workflow_dispatch:        # allow manual "Run workflow"

permissions:
  contents: write

concurrency:
  group: eventbrite-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull events from Eventbrite
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORG_ID: ${{ secrets.EVENTBRITE_ORG_ID }}  # optional
        run: node scripts/sync-eventbrite.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "eventbrite-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/events.js js/past.js
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Sync meetups from Eventbrite"
            git push
          fi
